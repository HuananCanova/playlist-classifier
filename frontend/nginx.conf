server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # O React Router resolve as rotas no cliente: qualquer caminho que não seja
    # um arquivo real precisa devolver o index.html, senão recarregar a página
    # em /playlists/123 daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets levam hash no nome, então podem ser cacheados de forma agressiva.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
