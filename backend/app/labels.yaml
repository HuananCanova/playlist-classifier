# Selos (gravadoras) → subgênero, como evidência de classificação.
#
# No psytrance o selo é uma pista forte e por lançamento: um disco da Suntrip é
# goa, um da Parvati é forest. E é um dado que já alcançamos — o detalhe do
# álbum no Deezer traz o selo, uma chamada por álbum, sem chave.
#
# Por que vale a pena: medido na biblioteca real (390 faixas psy), 207 têm selo
# (53%, ou 73% das encontradas no Deezer) e os selos se concentram — quatro
# cobrem 45% das faixas com selo. Comparado com as outras fontes no conjunto
# dourado: selo 77%, BPM 26%, tag de faixa 0%.
#
# ── De onde vem este mapa ───────────────────────────────────────────────────
#
# Das listas "Notable labels" de cada estilo em https://psytranceguide.com/ —
# a mesma referência que a taxonomia já cita para as faixas de BPM. **Não** do
# conjunto dourado: construir o mapa a partir dele seria corrigir a própria
# prova. O conjunto dourado só mede.
#
# Cada entrada diz de qual estilo do guia ela veio, para dar para conferir.
# Estilo do guia → subgênero daqui:
#
#   Progressive Psy → progressive psytrance    Dark Psy      → darkpsy
#   Hypnotic Psy    → hypnotic psy             Forest Psy    → forest psy
#   Psy-Techno      → psy-techno               Hi-Tech       → hitech
#   Offbeat         → offbeat                  Psycore       → psycore
#   Goa Trance      → goa trance               Suomi         → suomi
#   Nitzhonot       → nitzhonot                Psychill      → psychill
#   Full-on         → full-on                  Night Full-on → night full-on
#
# Quatro estilos do guia NÃO têm equivalente nesta taxonomia — "Psychedelic"
# (145–155), "Psytrance" (138–144, que aqui é o gênero e não um subgênero),
# "Raw Trance" e "Tribal". Selo que o guia lista só nesses estilos fica de
# fora: é melhor se abster do que forçar um rótulo que não existe aqui.
#
# ── Selo fora do mapa se abstém ─────────────────────────────────────────────
#
# Selo desconhecido não vota — nem chuta, nem conta como incerteza. Isso é
# carga, não detalhe: entre as faixas psy da biblioteca aparecem "Universal
# Music Australia", "Pink Floyd Records", "Spinnin' Records", "Kontor Records"
# e "Lord Huron" (nome de artista no campo de selo). Nenhum pode votar.
#
# ── Lacunas conhecidas (precisam de fonte, não de palpite) ──────────────────
#
# - Shamanic Tales (20 faixas na biblioteca): o guia lista em "Psytrance", que
#   aqui é o gênero. É o selo do Astrix, de Tel Aviv — provavelmente full-on,
#   mas "provavelmente" não entra num mapa de evidência.
# - Blue Tunes Records (10 faixas): o guia lista em "Tribal" (136–140), estilo
#   que não modelamos. Mapear para offbeat ou progressive seria chute.
# - Nano Records, Sol Music, Enterrec, HOMmega: idem, só em estilos sem
#   equivalente aqui.
# - Alwarda, Cosmonautica, Mystic Sound, Zenon Records, Nutek: não aparecem no
#   guia. Entram quando houver uma fonte para citar.
#
# ── Formato ─────────────────────────────────────────────────────────────────
#
#   <nome do selo>:
#     shares: {<subgênero>: <fatia>}   # soma 1; selo misto divide, não escolhe
#     aliases: [...]                   # grafias alternativas (opcional)
#     nota: uma linha, em palavras nossas                 # vai para a tela
#     fonte: URL                       # onde conferir
#     estilos: [...]                   # os estilos do guia que geraram as fatias

version: 1

fonte_padrao: https://psytranceguide.com/

