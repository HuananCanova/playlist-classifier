# Referências externas do conjunto dourado de subgênero.
#
# O rótulo de cada caso vem de FORA do app e de quem o mantém: ou é um exemplo
# que o Guia de Psytrance (psytranceguide.com) lista para o estilo, ou é o
# gênero/subgênero que a própria página da faixa no Beatport exibe. Nenhum
# rótulo é julgamento nosso, nem sai das playlists da conta.
#
# Formato de cada caso:
#   id          identificador curto
#   artista     nome usado nas consultas ao Last.fm e ao Deezer (o principal, quando há vários)
#   credito     artistas como creditados na referência (só para leitura)
#   titulo      título da faixa
#   subgenero   o subgênero da taxonomia que a referência indica
#   referencia  onde se confere: URL da faixa no Beatport, ou o guia + a seção
#   fonte       "guia" | "beatport"
#
# Cobertura honesta: o guia dá 4 exemplos por estilo; as páginas do Beatport só
# trazem subgênero em parte das faixas (a maioria vem só "Psy-Trance"), e o
# Beatport não tem offbeat nem psychill, e junta darkpsy+forest ("Dark & Forest")
# e hitech+psycore ("Psycore & Hi-Tech"). Esses estilos ficam com os 4 do guia.
# Faixas que o Beatport marca só como "Psy-Trance" ou com subgênero ambíguo
# foram lidas e DEIXADAS DE FORA em vez de completar a cota por palpite.

