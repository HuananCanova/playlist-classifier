  # ── comportamento do classificador ────────────────────────────────────────
  - id: so-ruido-nao-classifica
    faixa: (caso sintético) faixa só com tags que não são gênero
    nota: >
      Antes, "brasil" e "female vocalists" eram gênero e entravam no gráfico.
      Agora a faixa sai sem classificação — e a interface diz isso, em vez de
      mentir um rótulo.
    artista: [[brasil, 100], [female vocalists, 90], [seen live, 80], [90s, 70], [my top songs, 60]]
    genero: null

  - id: tag-desconhecida-vira-fila-de-trabalho
    faixa: (caso sintético) gênero que a taxonomia ainda não conhece
    nota: >
      Vaporwave é gênero de verdade e não está no YAML. O certo é não classificar
      E apontar a tag como pendência — é assim que a taxonomia cresce por dado,
      não por chute.
    artista: [[vaporwave, 100], [seen live, 50]]
    genero: null
    unresolved: [vaporwave]

  - id: grafia-nao-muda-o-genero
    faixa: (caso sintético) variações de grafia
    nota: Hífen, caixa e sublinhado são a mesma tag depois da normalização.
    artista: [[Hip-Hop, 100], [hip hop, 90], [HIP_HOP, 80]]
    genero: hip-hop

  - id: acento-nao-muda-o-genero
    faixa: (caso sintético) tag com acento
    artista: [[forró, 100], [sertanejo, 30]]
    genero: brasileiro
    subgenero: forro

  - id: filho-pontua-o-pai
    faixa: (caso sintético) pai e filhos juntos
    nota: >
      "rock" + "classic rock" + "hard rock" era o motivo de rock liderar tudo:
      três votos para três rótulos diferentes. Agora é um voto em rock, e o
      subgênero mais forte nomeia a faixa.
    artista: [[rock, 100], [classic rock, 95], [hard rock, 90]]
    genero: rock
    subgenero: classic rock

  - id: empate-e-deterministico
    faixa: (caso sintético) dois gêneros com peso idêntico
    nota: >
      Empate perfeito resolve por ordem alfabética, não por ordem de chegada.
      O caso existe para travar isso: sem regra fixa, a mesma faixa mudaria de
      gênero entre duas execuções.
    artista: [[techno, 100], [house, 100]]
    genero: house
