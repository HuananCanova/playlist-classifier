# Conjunto dourado da classificação de gênero.
#
# O que está sob teste: dado o que o Last.fm devolve para uma faixa, o app acerta
# o gênero? Não há modelo, rede nem banco aqui — `taxonomy.classify` é função
# pura, então este conjunto roda em CI em menos de um segundo e o resultado é
# sempre o mesmo. É a diferença entre "melhorei a classificação" e "a precisão
# de gênero subiu de X para Y em N faixas rotuladas à mão".
#
# As faixas são reais, do acervo desta conta, e as tags são as que o Last.fm
# devolveu de verdade. Os PESOS imitam a distribuição da API (a primeira tag
# perto de 100, caindo depois), porque é com peso que a classificação roda em
# produção — medir sem peso mediria outro programa.
#
# O rótulo esperado é julgamento humano sobre a faixa, não a saída do
# classificador: é isso que torna o número honesto. Casos em que duas respostas
# se defendem igualmente (Manu Chao entre latin e reggae, Anitta entre pop e
# funk carioca) ficaram FORA de propósito — um conjunto dourado com cara ou
# coroa dentro mede sorte.
#
# Formato de cada caso:
#   id          identificador curto
#   faixa       artista — título, só para a saída ficar legível
#   artista     tags de artist.getTopTags, como [nome, peso] ou só nome
#   faixa_tags  tags de track.getTopTags (opcional)
#   genero      o gênero esperado, ou null quando nada deve ser classificado
#   subgenero   opcional; quando presente, também é cobrado
#   nota        por que este caso existe, quando não é óbvio
#   unresolved  tags que devem aparecer como "sem casa no YAML" (opcional)

limiares:
  # Abaixo disto, `run_genre_evals.py` sai com erro — o CI reprova a mudança.
  genero: 0.90
  subgenero: 0.75

casos:

