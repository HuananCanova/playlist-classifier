name: CI

on:
  push:
    branches: [master]
  pull_request:
  # O job de evals custa tokens, então só roda quando disparado à mão.
  workflow_dispatch:

jobs:
  backend:
    name: Backend — testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pyyaml

      # O modelo de embeddings tem ~80 MB e é o mesmo em toda execução; sem o
      # cache, cada rodada baixaria de novo antes dos testes de busca.
      - name: Cache do modelo de embeddings
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-all-MiniLM-L6-v2

      - name: pytest
        working-directory: backend
        env:
          # Os testes não tocam em serviço externo, mas o `Settings` do pydantic
          # exige estes campos para carregar.
          SPOTIFY_CLIENT_ID: ci
          SPOTIFY_CLIENT_SECRET: ci
          LASTFM_API_KEY: ci
          SESSION_SECRET: ci-nao-usar-em-producao
        run: python -m pytest

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Só constrói: publicar exigiria um registry, e o valor aqui é pegar um
      # Dockerfile quebrado antes de alguém tentar subir o app.
      - name: Build do backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # O conjunto dourado roda contra um modelo de verdade e custa tokens, então
  # não roda a cada push. Dispare manualmente, ou depois de mexer em prompt ou
  # em ferramenta.
  evals:
    name: Conjunto dourado (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyyaml

      - name: Rodar evals
        working-directory: backend
        env:
          SPOTIFY_CLIENT_ID: ci
          SPOTIFY_CLIENT_SECRET: ci
          LASTFM_API_KEY: ci
          SESSION_SECRET: ci-nao-usar-em-producao
          CHAT_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m evals.run_evals
